<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>She Can Foundation Form</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      padding:20px;
    }

    .container{
      width:100%;
      max-width:420px;
      background:#fff;
      padding:35px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo{
      text-align:center;
      font-size:32px;
      margin-bottom:10px;
    }

    h1{
      text-align:center;
      color:#ff4f81;
      margin-bottom:10px;
    }

    p{
      text-align:center;
      color:#666;
      margin-bottom:25px;
      font-size:14px;
    }

    .input-box{
      margin-bottom:18px;
    }

    .input-box label{
      display:block;
      margin-bottom:6px;
      color:#444;
      font-weight:bold;
    }

    .input-box input,
    .input-box textarea{
      width:100%;
      padding:12px;
      border:2px solid #f1c4cf;
      border-radius:10px;
      outline:none;
      transition:0.3s;
      font-size:15px;
    }

    .input-box input:focus,
    .input-box textarea:focus{
      border-color:#ff4f81;
      box-shadow:0 0 8px rgba(255,79,129,0.3);
    }

    textarea{
      resize:none;
      height:100px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background: linear-gradient(135deg, #ff4f81, #ff7eb3);
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.03);
      opacity:0.9;
    }

    #successMessage{
      display:none;
      margin-top:20px;
      text-align:center;
      background:#e8fff1;
      color:#1d8f4d;
      padding:12px;
      border-radius:10px;
      font-weight:bold;
    }

    .footer{
      text-align:center;
      margin-top:18px;
      font-size:13px;
      color:#888;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🌸</div>

    <h1>She Can Foundation</h1>

    <p>Empowering Women Through Technology & Education</p>

    <form id="contactForm">

      <div class="input-box">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>
      </div>

      <div class="input-box">
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <label>Your Message</label>
        <textarea placeholder="Write your message..." required></textarea>
      </div>

      <button type="submit">Submit Form</button>

    </form>

    <div id="successMessage">
      ✅ Form Submitted Successfully!
    </div>

    <div class="footer">
      Made with ❤️ for She Can Foundation
    </div>

  </div>

  <script>
    const form = document.getElementById("contactForm");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function(event){
      event.preventDefault();

      successMessage.style.display = "block";

      form.reset();
    });
  </script>

</body>
</html>
